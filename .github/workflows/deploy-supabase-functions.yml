# Deploy Edge Functions no Supabase automaticamente quando supabase/functions/ alterar
# Requer secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF

name: Deploy Supabase Functions

on:
  push:
    branches: [master]
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref $SUPABASE_PROJECT_REF
