# Deploy Edge Functions no Supabase automaticamente quando supabase/functions/ alterar
# Requer em Settings → Secrets and variables → Actions:
#   SUPABASE_ACCESS_TOKEN  (criar em https://supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF   (id do projeto, ex: cwqguqkhwtcuwhkzsqvz — está na URL do dashboard)

name: Deploy Supabase Functions

on:
  push:
    branches: [master]
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Verificar secrets
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_PROJECT_REF não está definido. Configure em Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN não está definido. Crie em https://supabase.com/dashboard/account/tokens e adicione nos secrets."
            exit 1
          fi
          echo "Projeto ref configurado (comprimento: ${#SUPABASE_PROJECT_REF})"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref $SUPABASE_PROJECT_REF
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
