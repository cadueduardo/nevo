# Exemplo de server block para nevoqa.pratikapp.com.br
# Uso no VPS: sudo cp scripts/nginx-nevoqa.conf /etc/nginx/sites-available/nevoqa
#             Ajuste a porta em proxy_pass se o QA usar outra (ex.: 3010).
#             sudo ln -sf /etc/nginx/sites-available/nevoqa /etc/nginx/sites-enabled/
#             sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANTE: um único location / com proxy_pass evita 400 em /_next/static/

server {
    listen 80;
    listen [::]:80;
    server_name nevoqa.pratikapp.com.br;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}

# Se usar HTTPS (certbot/Let's Encrypt), o certbot costuma criar
# listen 443 ssl e incluir o mesmo server_name. Garanta que esse
# server também tenha apenas location / { proxy_pass ... } (sem
# location /_next/ com alias).
